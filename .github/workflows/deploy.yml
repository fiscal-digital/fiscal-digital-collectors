name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_rollback:
        description: "Implantar um commit que NÃO é o topo da main (rollback intencional)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

# Serializa runs de deploy contra o terraform state remoto (mesmo grupo do
# plan.yml — PR plan e push deploy não competem pelo lock DynamoDB).
# cancel-in-progress: false preserva runs em fila.
concurrency:
  group: terraform-state-collectors-prod
  cancel-in-progress: false

jobs:
  # Re-run de um deploy antigo reimplanta o commit daquele run e termina
  # verde (fiscal-digital#214). Aqui não há aprovação manual: o guarda é a
  # única barreira antes do apply.
  guard-main-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Commit é o topo da main?
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
        run: .github/scripts/guard-main-tip.sh

  deploy:
    needs: guard-main-tip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@fiscal-digital'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `npm ci` restaurado (#152 item 3) — idem plan.yml. Deploy tem que
        # instalar exatamente o que o PR-gate validou.
        run: npm ci --no-audit --no-fund

      - name: Build collectors
        run: npm run build

      - name: Bundle Lambdas
        # Loop sobre os workspaces presentes em collectors/*.
        # Bootstrap nao tem nenhum collector ainda — o for vira no-op.
        run: |
          shopt -s nullglob
          for dir in collectors/*/ ; do
            name=$(basename "$dir")
            echo "::group::bundle $name"
            npm run bundle --workspace="collectors/${name}" --if-present
            echo "::endgroup::"
          done

      - name: Zip Lambdas
        run: |
          shopt -s nullglob
          for dir in collectors/*/dist/ ; do
            name=$(basename "$(dirname "$dir")")
            if [ -f "${dir}index.js" ]; then
              zip -j "${dir}function.zip" "${dir}index.js"
              echo "zipped: ${name}"
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # Plan salvo + guarda: o apply aplica exatamente o que foi checado.
      # Antes era `apply -auto-approve` direto, sem nenhuma barreira.
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -var-file=environments/prod.tfvars -out=tfplan.bin

      - name: Guard destroys (padrão LRN-20260607-004 da engine)
        working-directory: terraform
        run: |
          terraform show -no-color tfplan.bin > plan-text.txt
          # Os recursos daqui são Lambdas, agendamentos, filas e tabelas em
          # uso diário: nenhum destroy/replace é rotineiro. Qualquer um barra.
          if grep -E "^  # .*(will be destroyed|must be replaced|will be replaced)" plan-text.txt; then
            if git log -1 --pretty=%B | grep -qF "[allow-critical-destroy]"; then
              echo "::warning::Destroy aceito via [allow-critical-destroy] no commit"
            else
              echo "::error::Plan destrói ou substitui recursos (acima). Bypass: [allow-critical-destroy] na mensagem do commit."
              exit 1
            fi
          fi
          echo "Plan sem destroys — OK"

      - name: Commit ainda é o topo da main?
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
        run: .github/scripts/guard-main-tip.sh

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan.bin

      - name: Deploy Lambda code
        # Loop sobre os zips gerados. Mapping dirname → Lambda function name
        # explicito porque os nomes das Lambdas em prod NAO seguem o padrao
        # `fiscal-digital-collector-${dirname}-prod`:
        #   - querido-diario → `fiscal-digital-collector-prod` (preservado do
        #     monorepo original; cutover α exige match bit-perfect)
        #   - supplier → `fiscal-digital-supplier-collector-prod` (criado novo)
        # Adicionar entry para cada novo collector no case statement abaixo.
        run: |
          shopt -s nullglob
          for zip in collectors/*/dist/function.zip ; do
            name=$(basename "$(dirname "$(dirname "$zip")")")
            case "$name" in
              querido-diario) fn="fiscal-digital-collector-prod" ;;
              supplier) fn="fiscal-digital-supplier-collector-prod" ;;
              *) fn="fiscal-digital-collector-${name}-prod" ;;
            esac
            echo "::group::deploy ${fn}"
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://${zip}" \
              --no-cli-pager
            aws lambda wait function-updated \
              --function-name "$fn" \
              --no-cli-pager
            VERSION=$(aws lambda publish-version \
              --function-name "$fn" \
              --no-cli-pager \
              --query Version --output text)
            aws lambda update-alias \
              --function-name "$fn" \
              --name prod \
              --function-version "$VERSION" \
              --no-cli-pager 2>/dev/null || \
            aws lambda create-alias \
              --function-name "$fn" \
              --name prod \
              --function-version "$VERSION" \
              --no-cli-pager
            echo "::endgroup::"
          done

      - name: Smoke pós-deploy
        run: .github/scripts/smoke-collectors.sh
